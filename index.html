<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MASTER SPH — Legal & Project Control System</title>

<style>
:root{
  --bg:#f3f4f6;
  --panel:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --blue:#2563eb;
  --green:#15803d;
  --yellow:#b45309;
  --red:#b91c1c;
  --orange:#ea580c;
  --shadow:0 8px 25px rgba(0,0,0,.07);
  --radius:14px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:280px;
  background:#111827;
  color:white;
  padding:20px;
  overflow-y:auto;
  z-index:20;
}

.brand{
  padding:8px 5px 20px;
  border-bottom:1px solid rgba(255,255,255,.12);
  margin-bottom:15px;
}

.brand h1{
  font-size:19px;
  margin:0 0 5px;
}

.brand p{
  margin:0;
  font-size:11px;
  color:#9ca3af;
  line-height:1.5;
}

.nav-section{
  margin:20px 0 8px;
  color:#6b7280;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}

.nav-btn{
  display:flex;
  width:100%;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  color:#d1d5db;
  padding:10px 11px;
  margin:2px 0;
  border-radius:9px;
  text-align:left;
}

.nav-btn:hover,
.nav-btn.active{
  background:#1f2937;
  color:white;
}

.nav-icon{
  width:22px;
  text-align:center;
}

/* MAIN */

.main{
  margin-left:280px;
  width:calc(100% - 280px);
  min-width:0;
}

.topbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(243,244,246,.94);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:13px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.top-title{
  font-size:17px;
  font-weight:800;
}

.top-sub{
  font-size:11px;
  color:var(--muted);
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:25px;
}

/* BUTTONS */

.btn{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  border-radius:9px;
  padding:9px 13px;
  font-weight:700;
  font-size:13px;
}

.btn:hover{
  background:#f9fafb;
}

.btn.primary{
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}

.btn.blue{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.btn.green{
  background:var(--green);
  border-color:var(--green);
  color:white;
}

.btn.red{
  background:var(--red);
  border-color:var(--red);
  color:white;
}

.btn.small{
  padding:6px 9px;
  font-size:11px;
}

/* CARDS */

.grid{
  display:grid;
  gap:15px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}

.card h3{
  margin:0 0 8px;
  font-size:16px;
}

.card h4{
  margin:0 0 7px;
  font-size:13px;
}

.muted{
  color:var(--muted);
}

.stat{
  position:relative;
}

.stat-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:800;
  letter-spacing:.5px;
}

.stat-value{
  font-size:30px;
  font-weight:900;
  margin-top:7px;
}

/* HEADINGS */

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:20px;
}

.page-head h2{
  margin:0 0 5px;
  font-size:25px;
}

.page-head p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

/* TABLE */

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  border-bottom:1px solid var(--line);
  padding:11px;
  text-align:left;
  font-size:12px;
  vertical-align:top;
}

th{
  background:#f9fafb;
  font-size:10px;
  text-transform:uppercase;
  color:#6b7280;
  letter-spacing:.5px;
}

tr:last-child td{
  border-bottom:0;
}

tr:hover td{
  background:#fafafa;
}

/* BADGES */

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.badge.green{
  background:#dcfce7;
  color:#166534;
}

.badge.yellow{
  background:#fef3c7;
  color:#92400e;
}

.badge.red{
  background:#fee2e2;
  color:#991b1b;
}

.badge.blue{
  background:#dbeafe;
  color:#1e40af;
}

.badge.gray{
  background:#f3f4f6;
  color:#4b5563;
}

/* FORM */

.form-group{
  margin-bottom:13px;
}

label{
  display:block;
  font-size:11px;
  font-weight:800;
  margin-bottom:5px;
}

input,select,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:8px;
  padding:9px 10px;
  background:white;
  color:var(--text);
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

/* PHASE */

.phase-list{
  display:grid;
  gap:10px;
}

.phase-card{
  border:1px solid var(--line);
  border-radius:12px;
  padding:15px;
  background:white;
}

.phase-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.phase-number{
  width:42px;
  height:42px;
  flex:0 0 42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:10px;
  background:#111827;
  color:white;
  font-weight:900;
}

.phase-main{
  flex:1;
}

.phase-title{
  font-weight:900;
  font-size:14px;
}

.phase-desc{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.progress{
  height:7px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
}

.progress > div{
  height:100%;
  background:#111827;
}

/* LEGAL */

.legal-box{
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:14px;
  background:#fafafa;
  margin-bottom:10px;
}

.legal-title{
  font-weight:900;
  font-size:13px;
}

.legal-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.warning{
  border-left:4px solid var(--yellow);
  background:#fffbeb;
  padding:12px;
  border-radius:8px;
}

.danger{
  border-left:4px solid var(--red);
  background:#fef2f2;
  padding:12px;
  border-radius:8px;
}

.success{
  border-left:4px solid var(--green);
  background:#f0fdf4;
  padding:12px;
  border-radius:8px;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  padding:20px;
  overflow:auto;
}

.modal.show{
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal-box{
  width:min(900px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.modal-head h3{
  margin:0;
}

/* CHECKLIST */

.check{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #f1f1f1;
}

.check input{
  width:auto;
  margin-top:3px;
}

.check span{
  font-size:12px;
}

/* TIMELINE */

.timeline{
  border-left:2px solid #e5e7eb;
  margin-left:7px;
  padding-left:20px;
}

.timeline-item{
  position:relative;
  margin-bottom:18px;
}

.timeline-item:before{
  content:"";
  position:absolute;
  left:-27px;
  top:3px;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#111827;
}

.timeline-date{
  font-size:10px;
  color:var(--muted);
}

.timeline-text{
  font-size:12px;
  margin-top:3px;
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .container{
    padding:15px;
  }

  .topbar{
    padding:10px 15px;
  }
}

/* PRINT */

@media print{
  .sidebar,
  .topbar,
  .top-actions,
  button{
    display:none!important;
  }

  .main{
    margin:0;
    width:100%;
  }

  .card{
    box-shadow:none;
  }
}
</style>
</head>

<body>

<div class="app">

  <button class="nav-btn" onclick="showPage('audit')">

  <input

    type="file"
    accept=".json"
    style="display:none"
    onchange="importData(event)"
  >

  <button class="nav-btn" onclick="window.print()">
    <span class="nav-icon">▣</span> Print
  </button>

</aside>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">

<header class="topbar">

  <div style="display:flex;align-items:center;gap:10px">
    <button class="btn mobile-menu" onclick="toggleSidebar()">☰</button>

    <div>
      <div class="top-title" id="topTitle">
        Dashboard
      </div>
      <div class="top-sub">
        MASTER SPH • Legal Control • Project Tracker
      </div>
    </div>
  </div>

  <div class="top-actions">
    <button class="btn" onclick="saveData()">Simpan</button>
    <button class="btn primary" onclick="openModal('quickModal')">
      + Quick Entry
    </button>
  </div>

</header>

<div class="container" id="content"></div>

</main>
</div>


<!-- =========================================================
     MODAL QUICK ENTRY
========================================================= -->

<div class="modal" id="quickModal">

<div class="modal-box">

  <div class="modal-head">
    <h3>Quick Entry</h3>
    <button class="btn" onclick="closeModal('quickModal')">✕</button>
  </div>

  <div class="grid grid-2">

    <div class="form-group">
      <label>Jenis</label>
      <select id="quickType">
        <option value="task">Task</option>
        <option value="risk">Red Flag</option>
        <option value="note">Catatan</option>
      </select>
    </div>

    <div class="form-group">
      <label>Persil</label>
      <select id="quickPersil">
        <option value="">Tidak terkait persil</option>
      </select>
    </div>

  </div>

  <div class="form-group">
    <label>Judul</label>
    <input id="quickTitle" placeholder="Masukkan judul">
  </div>

  <div class="form-group">
    <label>Catatan</label>
    <textarea id="quickNote" placeholder="Keterangan"></textarea>
  </div>

  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" onclick="closeModal('quickModal')">Batal</button>
    <button class="btn primary" onclick="addQuickEntry()">Simpan</button>
  </div>

</div>
</div>

/* =========================================================

========================================================= */

function saveData(){

  localStorage.setItem(
    "MASTER_SPH_DATA",
    JSON.stringify(state)
  );

  addAudit("SYSTEM","Data disimpan");

  toast("Data berhasil disimpan");

}


function addAudit(type,message){

  if(!state.audit) state.audit=[];

  state.audit.unshift({
    time:new Date().toLocaleString("id-ID"),
    type,
    message
  });

  if(state.audit.length>500){
    state.audit=state.audit.slice(0,500);
  }

  localStorage.setItem(
    "MASTER_SPH_DATA",
    JSON.stringify(state)
  );

}


function toast(message){

  const el=document.createElement("div");

  el.textContent=message;

  el.style.position="fixed";
  el.style.bottom="20px";
  el.style.right="20px";
  el.style.zIndex="999";
  el.style.background="#111827";
  el.style.color="white";
  el.style.padding="11px 15px";
  el.style.borderRadius="9px";
  el.style.fontSize="12px";
  el.style.fontWeight="700";

  document.body.appendChild(el);

  setTimeout(()=>el.remove(),2200);

}


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");

}


function statusBadge(status){

  const s=String(status||"").toUpperCase();

  let cls="gray";

  if(
    s.includes("SELESAI") ||
    s.includes("PASS") ||
    s.includes("BERLAKU")
  ) cls="green";

  else if(
    s.includes("PROSES") ||
    s.includes("PENDING") ||
    s.includes("REVIEW")
  ) cls="yellow";

  else if(
    s.includes("BLOCK") ||
    s.includes("RED") ||
    s.includes("RISIKO")
  ) cls="red";

  else if(
    s.includes("AKTIF")
  ) cls="blue";

  return `<span class="badge ${cls}">${esc(status)}</span>`;

}

  if(page==="tasks") renderTasks(content);

  if(page==="sop") renderSOP(content);

  document.getElementById("sidebar").classList.remove("open");

}

function filterPersils(){

  const q=(document.getElementById("persilSearch")?.value||"")
    .toLowerCase();

  const status=document.getElementById("persilStatus")?.value||"";
  const risk=document.getElementById("persilRisk")?.value||"";

  const rows=state.persils.filter(p=>{

    const text=(
      p.code+" "+
      p.name+" "+
      p.owner+" "+
      p.village+" "+
      p.district+" "+
      p.city
    ).toLowerCase();

    return (
      (!q || text.includes(q)) &&
      (!status || p.status===status) &&
      (!risk || p.risk===risk)
    );

  });

  const body=document.getElementById("persilBody");

  if(!body)return;

  body.innerHTML=rows.map(p=>`

    <tr>

      <td>
        <b>${esc(p.code)}</b>
      </td>

      <td>
        ${esc(p.owner||"-")}
      </td>

      <td>
        ${esc(
          [p.village,p.district,p.city,p.province]
          .filter(Boolean)
          .join(", ") || "-"
        )}
      </td>

      <td>${esc(p.landRight||"-")}</td>

      <td>${esc(p.certificate||"-")}</td>

      <td>
        Fase ${p.currentPhase}/16
      </td>

      <td>
        ${statusBadge(p.status)}
      </td>

      <td>
        ${statusBadge(p.risk)}
      </td>

      <td>
        <button
          class="btn small"
          onclick="editPersil(${p.id})"
        >
          Buka
        </button>
      </td>

    </tr>

  `).join("");

}

      </div>

/* =========================================================
   QUICK ENTRY
========================================================= */

function prepareQuickPersil(){

  const select=document.getElementById("quickPersil");

  if(!select)return;

  select.innerHTML=`

    <option value="">
      Tidak terkait persil
    </option>

    ${state.persils.map(p=>`
      <option value="${esc(p.code)}">
        ${esc(p.code)}
      </option>
    `).join("")}

  `;

}


function addQuickEntry(){

  const type=document.getElementById("quickType").value;
  const persil=document.getElementById("quickPersil").value;
  const title=document.getElementById("quickTitle").value;
  const note=document.getElementById("quickNote").value;

  if(!title.trim()){

    alert("Judul wajib diisi.");

    return;

  }

  if(type==="task"){

    state.tasks.push({
      title,
      persil,
      owner:"",
      deadline:"",
      status:"OPEN"
    });

  }

  if(type==="risk"){

    state.risks.push({
      persil,
      risk:title+" — "+note,
      level:"SEDANG",
      status:"OPEN",
      owner:"",
      mitigation:""
    });

  }

  if(type==="note"){

    state.notes.push({
      persil,
      title,
      note,
      time:new Date().toLocaleString("id-ID")
    });

  }

  addAudit(
    "QUICK",
    `${type}: ${title}`
  );

  saveData();

  document.getElementById("quickTitle").value="";
  document.getElementById("quickNote").value="";

  closeModal("quickModal");

}


/* =========================================================
   EXPORT / IMPORT
========================================================= */

function exportData(){

  const data=JSON.stringify(
    state,
    null,
    2
  );

  const blob=new Blob(
    [data],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download=
    "MASTER-SPH-BACKUP-"+
    new Date().toISOString().slice(0,10)+
    ".json";

  a.click();

  URL.revokeObjectURL(url);

  addAudit("SYSTEM","Export JSON");

}


function importData(event){

  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(){

    try{

      const imported=JSON.parse(
        reader.result
      );

      if(
        !imported.persils ||
        !imported.project
      ){

        throw new Error(
          "Format data tidak valid"
        );

      }

      if(!confirm(
        "Import akan mengganti data saat ini. Lanjutkan?"
      ))return;

      state=imported;

      saveData();

      location.reload();

    }catch(error){

      alert(
        "Import gagal: "+
        error.message
      );

    }

  };

  reader.readAsText(file);

}

   INITIALIZATION
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    showPage("dashboard");
    prepareQuickPersil();
